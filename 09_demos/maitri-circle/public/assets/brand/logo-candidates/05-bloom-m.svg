<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 420" role="img" aria-labelledby="title desc">
  <title id="title">Maitri bloom M</title>
  <desc id="desc">Three soft bloom lobes form an open M, with a warm friendship core in the center valley.</desc>
  <defs>
    <linearGradient id="bm-base" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff96af"/>
      <stop offset="0.5" stop-color="#ef7f9c"/>
      <stop offset="1" stop-color="#f7d5df"/>
    </linearGradient>
    <linearGradient id="bm-soft" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffb8c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4f7" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="bm-core" x1="0.3" y1="0.2" x2="0.7" y2="0.95">
      <stop offset="0" stop-color="#ffb098"/>
      <stop offset="1" stop-color="#ff96af" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Left stem/petal of M -->
  <path fill="url(#bm-base)" d="M78 360C70 250 78 140 118 72c28-48 78-52 112-18 18 18 28 44 34 78-22-20-50-30-78-24-36 8-58 46-62 108-2 36 4 78 12 144H78Z"/>
  <!-- Right stem/petal of M (mirrored) -->
  <path fill="url(#bm-base)" d="M434 360C442 250 434 140 394 72c-28-48-78-52-112-18-18 18-28 44-34 78 22-20 50-30 78-24 36 8 58 46 62 108 2 36-4 78-12 144h18Z"/>
  <!-- Center bloom lobe forming the M peak -->
  <path fill="url(#bm-base)" d="M256 318C210 250 186 186 198 128c8-42 42-72 78-72s70 30 78 72c12 58-12 122-58 190-14-22-26-42-40-62Z"/>

  <!-- Soft overlays -->
  <path fill="url(#bm-soft)" d="M102 330C96 240 104 150 136 96c18-32 50-36 74-14 12 12 20 30 24 52-16-14-36-22-56-18-26 6-42 34-44 78-2 28 2 60 8 108H102Z" opacity="0.85"/>
  <path fill="url(#bm-soft)" d="M410 330C416 240 408 150 376 96c-18-32-50-36-74-14-12 12-20 30-24 52 16-14 36-22 56-18 26 6 42 34 44 78 2 28-2 60-8 108h6Z" opacity="0.85"/>
  <path fill="url(#bm-soft)" d="M256 290C224 240 206 190 214 146c6-30 30-52 54-52s48 22 54 52c8 44-10 94-42 144-10-16-18-30-26-44Z" opacity="0.8"/>

  <!-- Friendship core in the M valley -->
  <circle cx="256" cy="168" r="28" fill="url(#bm-core)"/>
  <circle cx="248" cy="160" r="10" fill="#fff8ed" opacity="0.55"/>
</svg>
