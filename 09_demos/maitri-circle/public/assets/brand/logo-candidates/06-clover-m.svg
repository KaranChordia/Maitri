<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 400" role="img" aria-labelledby="title desc">
  <title id="title">Maitri clover M</title>
  <desc id="desc">A soft clover bloom whose overlapping petals read as an open letter M.</desc>
  <defs>
    <linearGradient id="cm-base" x1="0.2" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff96af"/>
      <stop offset="0.48" stop-color="#f08aa5"/>
      <stop offset="1" stop-color="#f8dce4"/>
    </linearGradient>
    <linearGradient id="cm-soft" x1="0.25" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#ffb8c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff4f7" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cm-core" x1="0.3" y1="0.15" x2="0.7" y2="0.9">
      <stop offset="0" stop-color="#ffb098"/>
      <stop offset="1" stop-color="#ff96af" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="cm-glow" cx="50%" cy="55%" r="48%">
      <stop offset="0" stop-color="#fff8ed" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff96af" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="256" cy="220" rx="220" ry="170" fill="url(#cm-glow)"/>

  <!-- Left outer petal (M left stem) -->
  <ellipse cx="150" cy="230" rx="88" ry="118" transform="rotate(-18 150 230)" fill="url(#cm-base)"/>
  <!-- Right outer petal (M right stem) -->
  <ellipse cx="362" cy="230" rx="88" ry="118" transform="rotate(18 362 230)" fill="url(#cm-base)"/>
  <!-- Center-left petal (M left peak) -->
  <ellipse cx="210" cy="150" rx="78" ry="102" transform="rotate(-8 210 150)" fill="url(#cm-base)"/>
  <!-- Center-right petal (M right peak) -->
  <ellipse cx="302" cy="150" rx="78" ry="102" transform="rotate(8 302 150)" fill="url(#cm-base)"/>

  <!-- Soft overlays for depth -->
  <ellipse cx="150" cy="220" rx="52" ry="72" transform="rotate(-18 150 220)" fill="url(#cm-soft)"/>
  <ellipse cx="362" cy="220" rx="52" ry="72" transform="rotate(18 362 220)" fill="url(#cm-soft)"/>
  <ellipse cx="210" cy="148" rx="46" ry="64" transform="rotate(-8 210 148)" fill="url(#cm-soft)" opacity="0.85"/>
  <ellipse cx="302" cy="148" rx="46" ry="64" transform="rotate(8 302 148)" fill="url(#cm-soft)" opacity="0.85"/>

  <!-- Warm core bridging the M valley -->
  <circle cx="256" cy="198" r="34" fill="url(#cm-core)"/>
  <circle cx="248" cy="188" r="12" fill="#fff8ed" opacity="0.5"/>
</svg>
